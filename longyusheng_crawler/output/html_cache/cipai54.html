<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html lang="zh-CN"><head><META http-equiv="Content-Type" content="text/html; charset=gb2312"><title>词牌《如梦令》——唐宋词格律(龙榆生)</title><meta http-equiv="Page-Enter" content="RevealTrans(Duration=0.5,Transition=7)"><meta name="keywords" content="如梦令, 忆仙姿, 宴桃源, 词牌, 格律, 唐宋词格律, 龙榆生, 电子书"><meta name="description" content="如梦令词牌格律"><meta name="author" content="龙榆生, 左伟明"><meta name="copyright" content="左伟明 (longyusheng.org), 二零二六年一月十八日"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="../style.css" rel="stylesheet" type="text/css"><script language="javascript" type="text/javascript">var depth = "../";</script><script src="../site.js" language="javascript" type="text/javascript" defer></script></head><body><div id="PageOuterFrame"><div id="PageInnerFrame"><div class="NaviPart Breadcrumb">当前位置：<span class="SiteMapNode"><a href="../index.html">龙榆生先生词学著作选</a></span>／<span class="SiteMapNode"><a href="../cipai/index.html">唐宋词格律</a></span>／<span class="SiteMapNode"><a href="../cipai/mulu.html">目录</a></span>／</div><h1 class="PageTitle">如梦令</h1><div class="BodyContent"><div class="Page"><div><div class="ItemTitle">【如梦令、忆仙姿、宴桃源】 </div><br><div class="cipaiDesc"><p>又名《忆仙姿》、《宴桃源》。<u>五代</u>时<u>后唐庄宗</u>（<u>李存勗</u>）创作。《<a title="参见 周邦彦 词集" href="../ci/zhoubangyan/index.html">清真集</a>》入“中吕调”。三十三字，五仄韵，一叠韵。</p></div><br class="empty"><a name="cp0"></a><div class="ItemTitle">【定格】</div><div class="ci"><blockquote><div><span class="zhong">中</span>仄<span class="zhong">中</span>平平<span class="ze">仄</span><span class="yun0">（韵）</span>，<span class="zhong">中</span>仄<span class="zhong">中</span>平平<span class="ze">仄</span><span class="yun0">（韵）</span>。</div><div><span class="zhong">中</span>仄仄平平，<span class="zhong">中</span>仄仄平平<span class="ze">仄</span><span class="yun0">（韵）</span>。</div><div>平<span class="ze">仄</span><span class="yun0">（韵）</span>，<span class="note">〖</span>平<span class="ze">仄</span><span class="yun0">（韵）</span><span class="note">〗</span>，<span class="zhong">中</span>仄仄平平<span class="ze">仄</span><span class="yun0">（韵）</span>。</div></blockquote></div><br><script type="text/javascript">var ces = {'ce1': { t: '<div>曾宴桃源深<span class="ze">洞</span>，一曲舞鸾歌<span class="ze">凤</span>。</div><div>长记别伊时，和泪出门相<span class="ze">送</span>。</div><div>如<span class="ze">梦</span>，如<span class="ze">梦</span>，残月落花烟<span class="ze">重</span>。</div>',w: '李存勗',c: '如梦令',n: '',h: '../ci/licunxu/1.html'},'ce2': { t: '<div>门外鸦啼杨<span class="ze">柳</span>，春色着人如<span class="ze">酒</span>。</div><div>睡起熨沉香，玉腕不胜金<span class="ze">斗</span>。</div><div>消<span class="ze">瘦</span>！</div><div>消<span class="ze">瘦</span>！</div><div>还是褪花时<span class="ze">候</span>。</div>',w: '秦观',c: '如梦令',n: '',h: '../ci/qinguan/12.html'},'ce3': { t: '<div>遥夜沉沉如<span class="ze">水</span>，风紧驿亭深<span class="ze">闭</span>。</div><div>梦破鼠窥灯，霜送晓寒侵<span class="ze">被</span>。</div><div>无<span class="ze">寐</span>！</div><div>无<span class="ze">寐</span>！</div><div>门外马嘶人<span class="ze">起</span>。</div>',w: '秦观',c: '如梦令',n: '',h: '../ci/qinguan/12.html'},'ce4': { t: '<div>门外绿阴千<span class="ze">顷</span>，两两黄鹂相<span class="ze">应</span>。</div><div>睡起不胜情，行到碧梧金<span class="ze">井</span>。</div><div>人<span class="ze">静</span>，人<span class="ze">静</span>，风动一枝花<span class="ze">影</span>。</div>',w: '曹组',c: '如梦令',n: '',h: '../ci/caozu/1.html'},'ce5': { t: '<div>昨夜雨疏风<span class="ze">骤</span>，浓睡不消残<span class="ze">酒</span>。</div><div>试问卷帘人，却道海棠依<span class="ze">旧</span>。</div><div>知<span class="ze">否</span>？</div><div>知<span class="ze">否</span>？</div><div>应是绿肥红<span class="ze">瘦</span>。</div>',w: '李清照',c: '如梦令',n: '',h: '../ci/liqingzhao/1.html'},'ce6': { t: '<div>常记溪亭日<span class="ze">暮</span>，沉醉不知归<span class="ze">路</span>。</div><div>兴尽晚回舟，误入藕花深<span class="ze">处</span>。</div><div>争<span class="ze">渡</span>，争<span class="ze">渡</span>，惊起一滩鸥<span class="ze">鹭</span>。</div>',w: '李清照',c: '如梦令',n: '',h: '../ci/liqingzhao/11.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai55.html" title="下一词牌：归自谣" rel="Next">归自谣</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="http://longyusheng.org" target="website">longyusheng.org</a>（<a href="http://beian.miit.gov.cn/" target="_blank">粤ICP备15040392号</a>）</div></div></div></body></html>
