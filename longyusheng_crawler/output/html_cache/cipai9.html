': { t: '<div>萋萋芳草忆王<span class="ping">孙</span>，柳外楼高空断<span class="ping">魂</span>，杜宇声声不忍<span class="ping">闻</span>。</div><div>欲黄<span class="ping">昏</span>，雨打梨花深闭<span class="ping">门</span>。</div>',w: '李重元',c: '忆王孙',n: '',h: '../ci/lichongyuan/1.html'},'ce2': { t: '<div><span class="mark">飕飕风冷荻花<span class="ping">秋</span>，</span></div><div>明月斜侵独倚<span class="ping">楼</span>。</div><div>十二珠帘不上<span class="ping">钩</span>，黯凝<span class="ping">眸</span>，<span class="mark">一点渔灯古渡<span class="ping">头</span>。</span></div>',w: '李重元',c: '忆王孙',n: '',h: '../ci/lichongyuan/2.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Prev">上一词牌：<a id="anc_prev" href="../cipai/cipai8.html" title="上一词牌：江南春" rev="Prev">江南春</a></span><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai10.html" title="下一词牌：江城子" rel="Next">江城子</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="http://longyusheng.org" target="website">longyusheng.org</a>（<a href="http://beian.miit.gov.cn/" target="_blank">粤ICP备15040392号</a>）</div></div></div></body></html>
