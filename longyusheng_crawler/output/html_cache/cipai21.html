<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html lang="zh-CN"><head><META http-equiv="Content-Type" content="text/html; charset=gb2312"><title>词牌《朝中措》——唐宋词格律(龙榆生)</title><meta http-equiv="Page-Enter" content="RevealTrans(Duration=0.5,Transition=7)"><meta name="keywords" content="朝中措, 词牌, 格律, 唐宋词格律, 龙榆生, 电子书"><meta name="description" content="朝中措词牌格律"><meta name="author" content="龙榆生, 左伟明"><meta name="copyright" content="左伟明 (longyusheng.org), 二零二六年一月十八日"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="../style.css" rel="stylesheet" type="text/css"><script language="javascript" type="text/javascript">var depth = "../";</script><script src="../site.js" language="javascript" type="text/javascript" defer></script></head><body><div id="PageOuterFrame"><div id="PageInnerFrame"><div class="NaviPart Breadcrumb">当前位置：<span class="SiteMapNode"><a href="../index.html">龙榆生先生词学著作选</a></span>／<span class="SiteMapNode"><a href="../cipai/index.html">唐宋词格律</a></span>／<span class="SiteMapNode"><a href="../cipai/mulu.html">目录</a></span>／</div><h1 class="PageTitle">朝中措</h1><div class="BodyContent"><div class="Page"><div><div class="ItemTitle">【朝中措】 </div><br><div class="cipaiDesc"><p>《宋史·乐志》入“黄钟宫”。四十八字，前片三平韵，后片两平韵。</p></div><br class="empty"><a name="cp0"></a><div class="ItemTitle">【定格】</div><div class="ci"><blockquote><div><span class="zhong">中</span>平<span class="zhong">中</span>仄仄平<span class="ping">平</span><span class="yun0">（韵）</span>，<span class="zhong">中</span>仄仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div><div><span class="zhong">中</span>仄<span class="zhong">中</span>平<span class="zhong">中</span>仄，<span class="zhong">中</span>平<span class="zhong">中</span>仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div><br class="empty"><div><span class="zhong">中</span>平<span class="zhong">中</span>仄，<span class="zhong">中</span>平<span class="zhong">中</span>仄，<span class="zhong">中</span>仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div><div><span class="zhong">中</span>仄<span class="zhong">中</span>平<span class="zhong">中</span>仄，<span class="zhong">中</span>平<span class="zhong">中</span>仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div></blockquote></div><br><script type="text/javascript">var ces = {'ce1': { t: '<div><u>平山</u>栏槛倚晴<span class="ping">空</span>，山色有无<span class="ping">中</span>。</div><div>手种堂前垂柳，别来几度春<span class="ping">风</span>？</div><br class="empty"/><div>文章太守，挥毫万字，一饮千<span class="ping">钟</span>。</div><div>行乐直须年少，尊前看取衰<span class="ping">翁</span>。</div>',w: '欧阳修',c: '朝中措',n: '',h: '../ci/ouyangxiu/2.html'},'ce2': { t: '<div>黄昏楼阁乱栖<span class="ping">鸦</span>，天末淡微<span class="ping">霞</span>。</div><div>风里一池杨柳，月边满树梨<span class="ping">花</span>。</div><br class="empty"/><div>阳台路远，鱼沉尺素，人在天<span class="ping">涯</span>。</div><div>想得小窗遥夜，哀弦拨断琵<span class="ping">琶</span>。</div>',w: '周紫芝',c: '朝中措',n: '',h: '../ci/zhouzizhi/1.html'},'ce3': { t: '<div>先生筇杖是生<span class="ping">涯</span>，挑月更担<span class="ping">花</span>。</div><div>把住都无憎爱，放行总是烟<span class="ping">霞</span>。</div><br class="empty"/><div>飘然携去，旗亭问酒，<u>萧寺</u>寻<span class="ping">茶</span>。</div><div>恰似黄鹂无定，不知飞到谁<span class="ping">家</span>？</div>',w: '朱敦儒',c: '朝中措',n: '',h: '../ci/zhudunru/5.html'},'ce4': { t: '<div>红稀绿暗掩重<span class="ping">门</span>，芳径罢追<span class="ping">寻</span>。</div><div>已是老于前岁，那堪穷似他<span class="ping">人</span>！</div><br class="empty"/><div>一杯自劝，江湖倦客，风雨残<span class="ping">春</span>。</div><div>不是酴醾相伴，如何过得黄<span class="ping">昏</span>？</div>',w: '朱敦儒',c: '朝中措',n: '',h: '../ci/zhudunru/5.html'},'ce5': { t: '<div>幽姿不入少年<span class="ping">场</span>，无语只凄<span class="ping">凉</span>。</div><div><span class="mark">一个飘零身世，十分冷淡心<span class="ping">肠</span>。</span></div><br class="empty"/><div>江头月底，新诗旧梦，孤恨清<span class="ping">香</span>。</div><div>任是春风不管，也曾先识<u>东<span class="ping">皇</span></u>。</div>',w: '陆游',c: '朝中措',n: '',h: '../ci/luyou/3.html'},'ce6': { t: '<div>清明时节雨声<span class="ping">哗</span>，潮拥渡头<span class="ping">沙</span>。</div><div>翻被梨花冷看，人生苦恋天<span class="ping">涯</span>。</div><br class="empty"/><div>燕帘莺户，云窗雾阁，酒醒啼<span class="ping">鸦</span>。</div><div>折得一枝杨柳，归来插向谁<span class="ping">家</span>？</div>',w: '张炎',c: '朝中措',n: '',h: '../ci/zhangyan/19.html'},'ce7': { t: '<div>时情天意枉论<span class="ping">量</span>，乐事苦相<span class="ping">忘</span>。</div><div>白酒家家新酿，黄花日日重<span class="ping">阳</span>。</div><br class="empty"/><div>城高望远，烟浓草澹，一片秋<span class="ping">光</span>。</div><div><span class="mark">故国江山如画，醉来忘却兴<span class="ping">亡</span>。</span></div>',w: '元好问',c: '朝中措',n: '',h: '../ci/yuanhaowen/15.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Prev">上一词牌：<a id="anc_prev" href="../cipai/cipai20.html" title="上一词牌：三字令" rev="Prev">三字令</a></span><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai22.html" title="下一词牌：眼儿媚" rel="Next">眼儿媚</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="http://longyusheng.org" target="website">longyusheng.org</a>（<a href="http://beian.miit.gov.cn/" target="_blank">粤ICP备15040392号</a>）</div></div></div></body></html>
