an class="yun0">（韵）</span>，仄<span class="zhong">中</span>仄、平平<span class="ze">仄</span><span class="yun0">（韵）</span>。</div></blockquote></div><br><script type="text/javascript">var ces = {'ce1': { t: '<div><u>江</u>水西头隔烟<span class="ze">树</span>，望不见、<u>江</u>东<span class="ze">路</span>。</div><div>思量只有梦来<span class="ze">去</span>，更不怕、<u>江</u>阑<span class="ze">住</span>。</div><br class="empty"/><div>灯前写了书无<span class="ze">数</span>，算没个、人传<span class="ze">与</span>。</div><div>直饶寻得雁分<span class="ze">付</span>，又还是、秋将<span class="ze">暮</span>。</div>',w: '黄庭坚',c: '望江东',n: '',h: '../ci/huangtingjian/13.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Prev">上一词牌：<a id="anc_prev" href="../cipai/cipai68.html" title="上一词牌：醉花阴" rev="Prev">醉花阴</a></span><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai70.html" title="下一词牌：木兰花" rel="Next">木兰花</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="http://longyusheng.org" target="website">longyusheng.org</a>（<a href="http://beian.miit.gov.cn/" target="_blank">粤ICP备15040392号</a>）</div></div></div></body></html>
