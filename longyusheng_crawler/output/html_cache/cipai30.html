<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html lang="zh-CN"><head><META http-equiv="Content-Type" content="text/html; charset=gb2312"><title>词牌《一剪梅》——唐宋词格律(龙榆生)</title><meta http-equiv="Page-Enter" content="RevealTrans(Duration=0.5,Transition=7)"><meta name="keywords" content="一剪梅, 词牌, 格律, 唐宋词格律, 龙榆生, 电子书"><meta name="description" content="一剪梅词牌格律"><meta name="author" content="龙榆生, 左伟明"><meta name="copyright" content="左伟明 (longyusheng.org), 二零二六年一月十八日"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="../style.css" rel="stylesheet" type="text/css"><script language="javascript" type="text/javascript">var depth = "../";</script><script src="../site.js" language="javascript" type="text/javascript" defer></script></head><body><div id="PageOuterFrame"><div id="PageInnerFrame"><div class="NaviPart Breadcrumb">当前位置：<span class="SiteMapNode"><a href="../index.html">龙榆生先生词学著作选</a></span>／<span class="SiteMapNode"><a href="../cipai/index.html">唐宋词格律</a></span>／<span class="SiteMapNode"><a href="../cipai/mulu.html">目录</a></span>／</div><h1 class="PageTitle">一剪梅</h1><div class="BodyContent"><div class="Page"><div><div class="ItemTitle">【一剪梅】 </div><br><div class="cipaiDesc"><p>双调小令，六十字，上下片各三平韵。每句并用平收，<strong>声情低抑</strong>。亦有句句叶韵者。</p></div><br class="empty"><a name="cp0"></a><div class="ItemTitle">【定格】</div><div class="ci"><blockquote><div><span class="zhong">中</span>仄平平<span class="zhong">中</span>仄<span class="ping">平</span><span class="yun0">（韵）</span>。</div><div><span class="zhong">中</span>仄平平，<span class="zhong">中</span>仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div><div><span class="zhong">中</span>平<span class="zhong">中</span>仄仄平平，<span class="zhong">中</span>仄平平，<span class="zhong">中</span>仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div><br class="empty"><div><span class="zhong">中</span>仄平平<span class="zhong">中</span>仄<span class="ping">平</span><span class="yun0">（韵）</span>。</div><div><span class="zhong">中</span>仄平平，<span class="zhong">中</span>仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div><div><span class="zhong">中</span>平<span class="zhong">中</span>仄仄平平，<span class="zhong">中</span>仄平平，<span class="zhong">中</span>仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div></blockquote></div><br><script type="text/javascript">var ces = {'ce1': { t: '<div>红藕香残玉簟<span class="ping">秋</span>。</div><div>轻解罗裳，独上兰<span class="ping">舟</span>。</div><div>云中谁寄锦书来？雁字回时，月满西<span class="ping">楼</span>。</div><br class="empty"/><div>花自飘零水自<span class="ping">流</span>。</div><div>一种相思，两处闲<span class="ping">愁</span>。</div><div>此情无计可消除，<span class="mark">才下眉头，却上心<span class="ping">头</span>。</span></div>',w: '李清照',c: '一剪梅',n: '',h: '../ci/liqingzhao/8.html'},'ce2': { t: '<div>一片春愁待酒<span class="ping">浇</span>，江上舟<span class="ping">摇</span>，楼上帘<span class="ping">招</span>。</div><div><u>秋娘</u>渡与<u>泰娘</u><span class="ping">桥</span>，风又飘<span class="ping">飘</span>，雨又<i>潇<span class="ping">潇</span></i>。</div><br class="empty"/><div>何日归家洗客<span class="ping">袍</span>？</div><div>银字笙<span class="ping">调</span>，心字香<span class="ping">烧</span>。</div><div>流光容易把人<span class="ping">抛</span>，红了樱<span class="ping">桃</span>，绿了芭<span class="ping">蕉</span>。</div>',w: '蒋捷',c: '一剪梅',n: '句句叶韵。',h: '../ci/jiangjie/5.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Prev">上一词牌：<a id="anc_prev" href="../cipai/cipai29.html" title="上一词牌：小重山" rev="Prev">小重山</a></span><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai31.html" title="下一词牌：唐多令" rel="Next">唐多令</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="http://longyusheng.org" target="website">longyusheng.org</a>（<a href="http://beian.miit.gov.cn/
