<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html lang="zh-CN"><head><META http-equiv="Content-Type" content="text/html; charset=gb2312"><title>词牌《谒金门》——唐宋词格律(龙榆生)</title><meta http-equiv="Page-Enter" content="RevealTrans(Duration=0.5,Transition=7)"><meta name="keywords" content="谒金门, 词牌, 格律, 唐宋词格律, 龙榆生, 电子书"><meta name="description" content="谒金门词牌格律"><meta name="author" content="龙榆生, 左伟明"><meta name="copyright" content="左伟明 (longyusheng.org), 二零二六年一月十八日"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="../style.css" rel="stylesheet" type="text/css"><script language="javascript" type="text/javascript">var depth = "../";</script><script src="../site.js" language="javascript" type="text/javascript" defer></script></head><body><div id="PageOuterFrame"><div id="PageInnerFrame"><div class="NaviPart Breadcrumb">当前位置：<span class="SiteMapNode"><a href="../index.html">龙榆生先生词学著作选</a></span>／<span class="SiteMapNode"><a href="../cipai/index.html">唐宋词格律</a></span>／<span class="SiteMapNode"><a href="../cipai/mulu.html">目录</a></span>／</div><h1 class="PageTitle">谒金门</h1><ul class="NaviPart"><li class="title">相关文章</li><li class="sub">《<a href="../cixueshijiang/index.html">词学十讲</a>》</li><li><a href="../cixueshijiang/lecture5-2.html">小令短调迫促情绪与韵位</a></li></ul><div class="BodyContent"><div class="Page"><div><div class="ItemTitle">【谒金门】 </div><br><div class="cipaiDesc"><p><u>唐</u>教坊曲。《金奁集》入“双调”。四十五字，前后片各四仄韵。</p></div><br class="empty"><a name="cp0"></a><div class="ItemTitle">【定格】</div><div class="ci"><blockquote><div>平<span class="zhong">中</span><span class="ze">仄</span><span class="yun0">（韵）</span>，平仄仄平平<span class="ze">仄</span><span class="yun0">（韵）</span>。</div><div><span class="zhong">中</span>仄<span class="zhong">中</span>平平仄<span class="ze">仄</span><span class="yun0">（韵）</span>，仄平平仄<span class="ze">仄</span><span class="yun0">（韵）</span>。</div><br class="empty"><div><span class="zhong">中</span>仄<span class="zhong">中</span>平<span class="zhong">中</span><span class="ze">仄</span><span class="yun0">（韵）</span>，<span class="zhong">中</span>仄<span class="zhong">中</span>平平<span class="ze">仄</span><span class="yun0">（韵）</span>。</div><div><span class="zhong">中</span>仄<span class="zhong">中</span>平平仄<span class="ze">仄</span><span class="yun0">（韵）</span>，仄平平仄<span class="ze">仄</span><span class="yun0">（韵）</span>。</div></blockquote></div><br><script type="text/javascript">var ces = {'ce1': { t: '<div>空相<span class="ze">忆</span>，无计得传消<span class="ze">息</span>。</div><div>天上<u>嫦娥</u>人不<span class="ze">识</span>，寄书何处<span class="ze">觅</span>？</div><br class="empty"/><div>新睡觉来无<span class="ze">力</span>，不忍看君书<span class="ze">迹</span>。</div><div>满院落花春寂<span class="ze">寂</span>，断肠芳草<span class="ze">碧</span>。</div>',w: '韦庄',c: '谒金门',n: '',h: '../ci/weizhuang/12.html'},'ce2': { t: '<div><span class="mark">留不<span class="ze">得</span>！</span></div><div><span class="mark">留得也应无<span class="ze">益</span>。</span></div><div><span class="mark">白纻春衫如雪<span class="ze">色</span>。</span></div><div><span class="mark"><u>扬州</u>初去<span class="ze">日</span>。</span></div><br class="empty"/><div><span class="mark">轻别离，甘抛<span class="ze">掷</span>，江上满帆风<span class="ze">疾</span>。</span></div><div><span class="mark">却羡彩鸳三十<span class="ze">六</span>，孤鸾还一<span class="ze">只</span>。</span></div>',w: '孙光宪',c: '谒金门',n: '',h: '../ci/sunguangqian/7.html'},'ce3': { t: '<div>杨柳<span class="ze">陌</span>，宝马嘶空无<span class="ze">迹</span>。</div><div>新着荷衣人未<span class="ze">识</span>，年年江海<span class="ze">客</span>。</div><br class="empty"/><div>梦觉<u>巫山</u>春<span class="ze">色</span>，醉眼飞花狼<span class="ze">籍</span>。</div><div><span class="mark">起舞不辞无气<span class="ze">力</span>，爱君吹玉<span class="ze">笛</span>。</span></div>',w: '冯延己',c: '谒金门',n: '',h: '../ci/fengyanji/5.html'},'ce4': { t: '<div>秋已<span class="ze">暮</span>，重叠关山歧<span class="ze">路</span>。</div><div>嘶马摇鞭何处<span class="ze">去</span>？</div><div>晓禽霜满<span class="ze">树</span>。</div><br class="empty"/><div>梦断禁城钟<span class="ze">鼓</span>，泪滴枕檀无<span class="ze">数</span>。</div><div>一点凝红和薄<span class="ze">雾</span>，翠娥愁不<span class="ze">语</span>。</div>',w: '冯延己',c: '谒金门',n: '',h: '../ci/fengyanji/5.html'},'ce5': { t: '<div>风乍<span class="ze">起</span>，吹皱一池春<span class="ze">水</span>。</div><div>闲引鸳鸯香径<span class="ze">里</span>，手挼红杏<span class="ze">蕊</span>。</div><br class="empty"/><div>斗鸭阑干独<span class="ze">倚</span>，碧玉搔头斜<span class="ze">坠</span>。</div><div><span class="mark">终日望君君不<span class="ze">至</span>，举头闻鹊<span class="ze">喜</span>。</span></div>',w: '冯延己',c: '谒金门',n: '',h: '../ci/fengyanji/5.html'},'ce6': { t: '<div>山又<span class="ze">水</span>，行尽<u>吴</u>头<u>楚</u><span class="ze">尾</span>。</div><div>兄弟灯前家万<span class="ze">里</span>，相看如梦<span class="ze">寐</span>。</div><br class="empty"/><div>君似成蹊桃<span class="ze">李</span>，入我草堂松<span class="ze">桂</span>。</div><div>草厌岁寒无气<span class="ze">味</span>，馀生今已<span class="ze">矣</span>！</div>',w: '黄庭坚',c: '谒金门',n: '',h: '../ci/huangtingjian/8.html'},'ce7': { t: '<div>杨花<span class="ze">落</span>，燕子横穿朱<span class="ze">阁</span>。</div><div><span class="mark">常恨春醪如水<span class="ze">薄</span>，闲愁无处<span class="ze">着</span>。</span></div><br class="empty"/><div><span class="mark">绿野带红山络<span class="ze">角</span>，桃杏参差前<span class="ze">约</span>。</span></div><div><span class="mark">历历危樯沙外<span class="ze">泊</span>，东风晚来<span class="ze">恶</span>。</span></div>',w: '贺铸',c: '谒金门',n: '',h: '../ci/hezhu/30.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Prev">上一词牌：<a id="anc_prev" href="../cipai/cipai62.html" title="上一词牌：卜算子" rev="Prev">卜算子</a></span><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai64.html" title="下一词牌：好事近" rel="Next">好事近</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="
