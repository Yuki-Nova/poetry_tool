n0">（韵）</span>。</div></blockquote></div><br><script type="text/javascript">var ces = {'ce1': { t: '<div><u>楚</u>女不<span class="ping">归</span>，楼枕小河春<span class="ze">水</span>。</div><div>月孤明，风又<span class="ze">起</span>。</div><div>杏花<span class="ping">稀</span>。</div><br class="empty"/><div>玉钗斜篸云囊<span class="ze">重</span>。</div><div>裙上缕金双<span class="ze">凤</span>。</div><div>八行书，千里<span class="ze">梦</span>。</div><div>雁南<span class="ping">飞</span>。</div>',w: '温庭筠',c: '酒泉子',n: '',h: '../ci/wentingyun/3.html'},'ce2': { t: '<div>罗带惹<span class="ping">香</span>，犹系别时红<span class="ze">豆</span>。</div><div>泪痕新，金缕<span class="ze">旧</span>，断离<span class="ping">肠</span>。</div><br class="empty"/><div>一双娇燕语雕<span class="ping">梁</span>，还是去年时<span class="ze">节</span>。</div><div>绿阴浓，芳草<span class="ze">歇</span>，柳花<span class="ping">狂</span>。</div>',w: '温庭筠',c: '酒泉子',n: '',h: '../ci/wentingyun/14.html'},'ce3': { t: '<div>枕转簟<span class="ping">凉</span>，<span class="mark">清晓远钟残<span class="ze">梦</span>。</span></div><div>月光斜，帘影<span class="ze">动</span>，旧炉<span class="ping">香</span>。</div><br class="empty"/><div>梦中说尽相思<span class="ze">事</span>，纤手匀双<span class="ze">泪</span>。</div><div><span class="mark">去年书，今日<span class="ze">意</span>，断离<span class="ping">肠</span>。</span></div>',w: '牛希济',c: '酒泉子',n: '',h: '../ci/niuxiji/1.html'},'ce4': { t: '<div>雨渍花<span class="ping">零</span>，<span class="mark">红散香凋池两<span class="ze">岸</span>。</span></div><div>别情遥，春歌<span class="ze">断</span>，掩银<span class="ping">屏</span>。</div><br class="empty"/><div>孤帆早晚离<u>三<span class="ze">楚</span></u>，闲理钿筝愁几<span class="ze">许</span>。</div><div><span class="mark">曲中<span class="ping">情</span>，弦上<span class="ze">语</span>，不堪<span class="ping">听</span>！</span></div>',w: '李珣',c: '酒泉子',n: '',h: '../ci/lixun/1.html'},'ce5': { t: '<div><span class="mark">秋雨联<span class="ping">绵</span>，声散败荷丛<span class="ze">里</span>。</span></div><div><span class="mark">那堪深夜枕前<span class="ping">听</span>，酒初<span class="ping">醒</span>。</span></div><br class="empty"/><div>牵愁惹思更无<span class="ping">停</span>，烛暗香凝天欲晓，细和<span class="ping">烟</span>，冷和<span class="ze">雨</span>，透帘<span class="ping">中</span>。</div><div><span class="note"><u>郑文焯</u>云：“中”，疑“巾”或“旌”之讹</span></div>',w: '李珣',c: '酒泉子',n: '',h: '../ci/lixun/1.html'},'ce6': { t: '<div>空碛无边，万里<u>阳关</u>道<span class="ze">路</span>。</div><div>马萧萧，人去<span class="ze">去</span>，<u>陇</u>云<span class="ping">愁</span>。</div><br class="empty"/><div><span class="mark">香貂旧制戎衣<span class="ze">窄</span>，胡霜千里<span class="ze">白</span>。</span></div><div>绮罗心，魂梦<span class="ze">隔</span>，上高<span class="ping">楼</span>。</div>',w: '孙光宪',c: '酒泉子',n: '',h: '../ci/sunguangqian/5.html'},'ce7': { t: '<div>芳草长<span class="ping">川</span>，柳映危桥桥下<span class="ze">路</span>。</div><div>归鸿飞，行人<span class="ze">去</span>，碧山<span class="ping">边</span>。</div><br class="empty"/><div>风微烟澹雨萧<span class="ping">然</span>，<span class="mark">隔岸马嘶何<span class="ze">处</span>？</span></div><div><span class="mark">九回肠，双脸<span class="ze">泪</span>，夕阳<span class="ping">天</span>。</span></div>',w: '冯延己',c: '酒泉子',n: '',h: '../ci/fengyanji/3.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Prev">上一词牌：<a id="anc_prev" href="../cipai/cipai150.html" title="上一词牌：上行杯" rev="Prev">上行杯</a></span><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai152.html" title="下一词牌：定风波" rel="Next">定风波</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="http://longyusheng.org" target="website">longyusheng.org</a>（<a href="http://beian.miit.gov.cn/" target="_blank">粤ICP备15040392号</a>）</div></div></div></body></html>
