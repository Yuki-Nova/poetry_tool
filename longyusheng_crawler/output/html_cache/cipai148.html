">中</span><span class="ze">仄</span><span class="yun0">（韵）</span>，仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div></blockquote></div><br><script type="text/javascript">var ces = {'ce1': { t: '<div><u>汉</u>使昔年离<span class="ze">别</span>，攀弱柳，折寒<span class="ping">梅</span>，上高<span class="ping">台</span>。</div><br class="empty"/><div>千里<u>玉关</u>春<span class="ze">雪</span>，雁来人不<span class="ping">来</span>。</div><div>羌笛一声愁<span class="ze">绝</span>，月徘<span class="ping">徊</span>。</div>',w: '温庭筠',c: '定西番',n: '',h: '../ci/wentingyun/13.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Prev">上一词牌：<a id="anc_prev" href="../cipai/cipai147.html" title="上一词牌：荷叶杯" rev="Prev">荷叶杯</a></span><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai149.html" title="下一词牌：相见欢" rel="Next">相见欢</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="http://longyusheng.org" target="website">longyusheng.org</a>（<a href="http://beian.miit.gov.cn/" target="_blank">粤ICP备15040392号</a>）</div></div></div></body></html>
