<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html lang="zh-CN"><head><META http-equiv="Content-Type" content="text/html; charset=gb2312"><title>词牌《渔歌子》——唐宋词格律(龙榆生)</title><meta http-equiv="Page-Enter" content="RevealTrans(Duration=0.5,Transition=7)"><meta name="keywords" content="渔歌子, 词牌, 格律, 唐宋词格律, 龙榆生, 电子书"><meta name="description" content="渔歌子词牌格律"><meta name="author" content="龙榆生, 左伟明"><meta name="copyright" content="左伟明 (longyusheng.org), 二零二六年一月十八日"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="../style.css" rel="stylesheet" type="text/css"><script language="javascript" type="text/javascript">var depth = "../";</script><script src="../site.js" language="javascript" type="text/javascript" defer></script></head><body><div id="PageOuterFrame"><div id="PageInnerFrame"><div class="NaviPart Breadcrumb">当前位置：<span class="SiteMapNode"><a href="../index.html">龙榆生先生词学著作选</a></span>／<span class="SiteMapNode"><a href="../cipai/index.html">唐宋词格律</a></span>／<span class="SiteMapNode"><a href="../cipai/mulu.html">目录</a></span>／</div><h1 class="PageTitle">渔歌子</h1><div class="BodyContent"><div class="Page"><div><div class="ItemTitle">【渔歌子】 </div><br><div class="cipaiDesc"><p>又名《渔父》。<u>唐</u>教坊曲，入“黄钟宫”。廿七字，四平韵。中间三言两句，例用对偶。</p></div><br class="empty"><a name="cp0"></a><div class="ItemTitle">【定格】</div><div class="ci"><blockquote><div><span class="zhong">中</span>仄平平仄仄<span class="ping">平</span><span class="yun0">（韵）</span>，<span class="zhong">中</span>平平仄仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div><div><span class="duiou"><sup>『</sup>平仄仄，仄平<span class="ping">平</span><span class="yun0">（韵）</span><sub>』</sub></span>，平平仄仄仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div></blockquote></div><br><script type="text/javascript">var ces = {'ce1': { t: '<div><u>西塞山</u>前白鹭<span class="ping">飞</span>，桃花流水鳜鱼<span class="ping">肥</span>。</div><div>青箬笠，绿蓑<span class="ping">衣</span>，斜风细雨不须<span class="ping">归</span>。</div>',w: '张志和',c: '渔歌子',n: '',h: '../ci/zhangzhihe/1.html'},'ce2': { t: '<div>荻花秋，潇湘<span class="ze">夜</span>，橘洲佳景如屏<span class="ze">画</span>。</div><div>碧烟中，明月<span class="ze">下</span>，小艇垂纶初<span class="ze">罢</span>。</div><br class="empty"/><div>水为乡，篷作<span class="ze">舍</span>，鱼羹稻饭常餐<span class="ze">也</span>。</div><div>酒盈杯，书满<span class="ze">架</span>，名利不将心<span class="ze">挂</span>。</div>',w: '李珣',c: '渔歌子',n: '',h: '../ci/lixun/2.html'},'ce3': { t: '<div><u>九疑山</u>，<u>三湘</u><span class="ze">水</span>，芦花时节秋风<span class="ze">起</span>。</div><div>水云间，山月<span class="ze">里</span>，棹水穿云游<span class="ze">戏</span>。</div><br class="empty"/><div>鼓青琴，倾绿<span class="ze">蚁</span>，扁舟自得逍遥<span class="ze">志</span>。</div><div>任东西，无定<span class="ze">止</span>，不议人间醒<span class="ze">醉</span>。</div>',w: '李珣',c: '渔歌子',n: '',h: '../ci/lixun/2.html'},'ce4': { t: '<div>泛流萤，明又<span class="ze">灭</span>。</div><div><span class="mark">夜凉水冷东湾<span class="ze">阔</span>。</span></div><div>风浩浩，笛寥寥，万顷金波澄<span class="ze">澈</span>。</div><br class="empty"/><div>杜若洲，香郁<span class="ze">烈</span>。</div><div>一声宿雁霜时<span class="ze">节</span>。</div><div>经<u>霅水</u>，过<u>松江</u>，<span class="mark">尽属侬家日<span class="ze">月</span>。</span></div>',w: '孙光宪',c: '渔歌子',n: '',h: '../ci/sunguangqian/8.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Prev">上一词牌：<a id="anc_prev" href="../cipai/cipai2.html" title="上一词牌：南歌子" rev="Prev">南歌子</a></span><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai4.html" title="下一词牌：忆江南" rel="Next">忆江南</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="http://longyusheng.org" target="website">longyusheng.org</a>（<a href="http://beian.miit.gov.cn/" target="_blank">粤ICP备15040392号</a>）</div></div></div></body></html>
