': { t: '<div>休相<span class="ze">问</span>，怕相<span class="ze">问</span>，相问还添<span class="ze">恨</span>。</div><div>春水满塘生，����还相<span class="ze">趁</span>。</div><br class="empty"/><div><span class="mark">昨夜雨霏霏，临明寒一<span class="ze">阵</span>。</span></div><div><span class="mark">偏忆戍楼人，久绝边庭<span class="ze">信</span>！</span></div>',w: '毛文锡',c: '醉花间',n: '',h: '../ci/maowenxi/2.html'},'ce2': { t: '<div>深相<span class="ze">忆</span>，莫相<span class="ze">忆</span>，相忆情无<span class="ze">极</span>。</div><div>银汉是红墙，一带遥相<span class="ze">隔</span>。</div><br class="empty"/><div>金盘珠露<span class="ze">滴</span>，两岸榆花<span class="ze">白</span>。</div><div>风摇玉佩清，今夕为何<span class="ze">夕</span>？</div>',w: '毛文锡',c: '醉花间',n: '',h: '../ci/maowenxi/4.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Prev">上一词牌：<a id="anc_prev" href="../cipai/cipai57.html" title="上一词牌：生查子" rev="Prev">生查子</a></span><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai59.html" title="下一词牌：点绛唇" rel="Next">点绛唇</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="http://longyusheng.org" target="website">longyusheng.org</a>（<a href="http://beian.miit.gov.cn/" target="_blank">粤ICP备15040392号</a>）</div></div></div></body></html>
