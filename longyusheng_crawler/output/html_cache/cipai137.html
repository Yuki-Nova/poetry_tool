<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html lang="zh-CN"><head><META http-equiv="Content-Type" content="text/html; charset=gb2312"><title>词牌《忆馀杭》——唐宋词格律(龙榆生)</title><meta http-equiv="Page-Enter" content="RevealTrans(Duration=0.5,Transition=7)"><meta name="keywords" content="忆馀杭, 词牌, 格律, 唐宋词格律, 龙榆生, 电子书"><meta name="description" content="忆馀杭词牌格律"><meta name="author" content="龙榆生, 左伟明"><meta name="copyright" content="左伟明 (longyusheng.org), 二零二六年一月十八日"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="../style.css" rel="stylesheet" type="text/css"><script language="javascript" type="text/javascript">var depth = "../";</script><script src="../site.js" language="javascript" type="text/javascript" defer></script></head><body><div id="PageOuterFrame"><div id="PageInnerFrame"><div class="NaviPart Breadcrumb">当前位置：<span class="SiteMapNode"><a href="../index.html">龙榆生先生词学著作选</a></span>／<span class="SiteMapNode"><a href="../cipai/index.html">唐宋词格律</a></span>／<span class="SiteMapNode"><a href="../cipai/mulu.html">目录</a></span>／</div><h1 class="PageTitle">忆馀杭</h1><div class="BodyContent"><div class="Page"><div><div class="ItemTitle">【忆馀杭】 </div><br><div class="cipaiDesc"><p>见《逍遥词》，<u>宋</u>初<u>潘阆</u>所作。因忆<u>西湖</u>诸胜，故名《忆馀杭》。四十九字，前片两平韵，后片两仄韵，两平韵。</p></div><br class="empty"><a name="cp0"></a><div class="ItemTitle">【定格】</div><div class="ci"><blockquote><div>平仄平平，<span class="zhong">中</span>仄平平平仄仄，平平仄仄仄平<span class="ping">平</span><span class="yun0">（韵）</span>，<span class="zhong">中</span>仄仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div><br class="empty"><div>仄平平仄平平<span class="ze">仄</span><span class="yun0">（韵）</span>，仄仄仄平仄平<span class="ze">仄</span><span class="yun0">（韵）</span>。</div><div>仄平平仄仄平<span class="ping2">平</span><span class="yun0">（韵）</span>，仄仄仄平<span class="ping2">平</span><span class="yun0">（韵）</span>。</div></blockquote></div><br><script type="text/javascript">var ces = {'ce1': { t: '<div>长忆<u>钱塘</u>，不是人寰是天上，万家掩映翠微<span class="ping">间</span>，处处水潺<span class="ping">潺</span>。</div><br class="empty"/><div>异花四季当窗<span class="ze">放</span>，出入分明在屏<span class="ze">障</span>。</div><div>别来<u>隋</u>柳几经<span class="ping">秋</span>，何日得重<span class="ping">游</span>？</div>',w: '潘阆',c: '忆馀杭',n: '',h: '../ci/panlang/1.html'},'ce2': { t: '<div>长忆<u>钱塘</u>，临水傍山三百寺，僧房携杖遍曾<span class="ping">游</span>，闲话觉忘<span class="ping">忧</span>。</div><br class="empty"/><div>旃檀楼阁云霞<span class="ze">畔</span>，钟梵清宵彻天<span class="ze">汉</span>。</div><div>别来遥礼只焚<span class="ping">香</span>，便恐是西<span class="ping">方</span>。 </div>',w: '潘阆',c: '忆馀杭',n: '',h: '../ci/panlang/1.html'},'ce3': { t: '<div>长忆<u>西湖</u>，湖上春来无限景，<u>吴</u>姬个个是神<span class="ping">仙</span>，竞泛木兰<span class="ping">船</span>。</div><br class="empty"/><div>楼台簇簇疑<u>蓬<span class="ze">岛</span></u>，野人只合其中<span class="ze">老</span>。</div><div>别来已是二十<span class="ping">年</span>，东望眼将<span class="ping">穿</span>。</div>',w: '潘阆',c: '忆馀杭',n: '',h: '../ci/panlang/1.html'},'ce4': { t: '<div>长忆<u>西湖</u>，尽日凭阑楼上望，三三两两钓鱼<span class="ping">舟</span>，岛屿正清<span class="ping">秋</span>。</div><br class="empty"/><div>笛声依约芦花<span class="ze">里</span>，白鸟<i>数</i>行忽惊<span class="ze">起</span>。</div><div>别来闲整钓鱼<span class="ping">竿</span>，思入水云<span class="ping">寒</span>。</div>',w: '潘阆',c: '忆馀杭',n: '',h: '../ci/panlang/1.html'},'ce5': { t: '<div>长忆<u>孤山</u>，山在湖心如黛簇，僧房四面向湖<span class="ping">开</span>，轻棹去还<span class="ping">来</span>。</div><br class="empty"/><div><span class="mark">芰荷香喷<u>连云<span class="ze">阁</span></u>，阁上清声檐下<span class="ze">铎</span>。</span></div><div><span class="mark">别来尘土污人<span class="ping">衣</span>，空役梦魂<span class="ping">飞</span>。</span></div>',w: '潘阆',c: '忆馀杭',n: '',h: '../ci/panlang/1.html'},'ce6': { t: '<div>长忆<u>西山</u>，<u>灵隐寺</u>前<u>三竺</u>后，<u>冷泉亭</u>上几行<span class="ping">游</span>，三伏似清<span class="ping">秋</span>。</div><br class="empty"/><div><span class="mark">白猿时见攀高<span class="ze">树</span>，长啸一声何处<span class="ze">去</span>？</span></div><div><span class="mark">别来几向画阑<span class="ping">看</span>，终是欠峰<span class="ping">峦</span>。</span></div>',w: '潘阆',c: '忆馀杭',n: '',h: '../ci/panlang/1.html'},'ce7': { t: '<div>长忆<u>高峰</u>，峰上塔高尘世外，昔年独上最高<span class="ping">层</span>，月出见微<span class="ping">棱</span>。</div><br class="empty"/><div>举头恐尺疑天<span class="ze">汉</span>，星斗分明在身<span class="ze">畔</span>。</div><div>别来无翼可飞<span class="ping">腾</span>，何日得重<span class="ping">登</span>。</div>',w: '潘阆',c: '忆馀杭',n: '',h: '../ci/panlang/1.html'},'ce8': { t: '<div>长忆<u>吴山</u>，山上森森<u>伍相庙</u>，庙前江水怒为<span class="ping">涛</span>，千古恨犹<span class="ping">高</span>。</div><br class="empty"/><div><span class="mark">寒雅日暮鸣还<span class="ze">聚</span>，时有阴云笼殿<span class="ze">宇</span>。</span></div><div>别来有负谒灵<span class="ping">祠</span>，遥奠酒盈<span class="ping">巵</span>。</div>',w: '潘阆',c: '忆馀杭',n: '',h: '../ci/panlang/1.html'},'ce9': { t: '<div>长忆<u>龙山</u>，日月宫中谁得到？宫中旦暮听潮<span class="ping">声</span>，台殿竹风<span class="ping">清</span>。</div><br class="empty"/><div>门前岁岁生灵<span class="ze">草</span>，人采食之多不<span class="ze">老</span>。</div><div>别来已白数茎<span class="ping">头</span>，早晚却重<span class="ping">游</span>。</div>',w: '潘阆',c: '忆馀杭',n: '',h: '../ci/panlang/1.html'},'ce10': { t: '<div>长忆观潮，满郭人争江上望，来疑沧海尽成<span class="ping">空</span>，万面鼓声<span class="ping">中</span>。</div><br class="empty"/><div>弄潮儿向涛头<span class="ze">立</span>，手把红旗旗不<span class="ze">湿</span>。</div><div>别来几向梦中<span class="ping">看</span>，梦觉尚心<span class="ping">寒</span>。</div>',w: '潘阆',c: '忆馀杭',n: '',h: '../ci/panlang/1.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Prev">上一词牌：<a id="anc_prev" href="../cipai/cipai136.html" title="上一词牌：清平乐" rev="Prev">清平乐</a></span><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai138.html" title="下一词牌：河渎神" rel="Next">河渎神</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="http://longyusheng.org" target="website">longyusheng.org</a>（<a href="http://beian.miit.gov.cn/" target="_blank">粤ICP备15040392号</a>）</div></div></div></body></html>
