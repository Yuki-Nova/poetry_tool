span>仄，平平仄仄，<span class="zhong">中</span>仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div></blockquote></div><br><script type="text/javascript">var ces = {'ce1': { t: '<div>小桃枝上春来早，初试薄罗<span class="ping">衣</span>。</div><div>年年此夜，华灯竞处，人月圆<span class="ping">时</span>。</div><br class="empty"/><div>禁街箫鼓，寒轻夜永，纤手同<span class="ping">携</span>。</div><div>夜阑人静，千门笑语，声在帘<span class="ping">帏</span>。</div>',w: '王诜',c: '人月圆',n: '',h: '../ci/wangshen/1.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Prev">上一词牌：<a id="anc_prev" href="../cipai/cipai22.html" title="上一词牌：眼儿媚" rev="Prev">眼儿媚</a></span><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai24.html" title="下一词牌：柳梢青" rel="Next">柳梢青</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="http://longyusheng.org" target="website">longyusheng.org</a>（<a href="http://beian.miit.gov.cn/" target="_blank">粤ICP备15040392号</a>）</div></div></div></body></html>
