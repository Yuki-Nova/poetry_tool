韵）</span>。</div></blockquote></div><br><script type="text/javascript">var ces = {'ce1': { t: '<div>何处<span class="ze">笛</span>？</div><div>终夜梦魂情脉<span class="ze">脉</span>。</div><div>竹风<i>檐</i>雨寒窗<span class="ze">滴</span>。</div><br class="empty"/><div>离人数岁无消<span class="ze">息</span>。</div><div>今头<span class="ze">白</span>，不眠特地重相<span class="ze">忆</span>。</div>',w: '冯延己',c: '归自谣',n: '',h: '../ci/fengyanji/6.html'},'ce2': { t: '<div><span class="mark">春艳<span class="ze">艳</span>，江上晚山三四<span class="ze">点</span>，柳丝如剪花如<span class="ze">染</span>。</span></div><br class="empty"/><div>香闺寂寂门半<span class="ze">掩</span>。</div><div>愁眉<span class="ze">敛</span>，泪珠滴破燕脂<span class="ze">脸</span>。</div>',w: '冯延己',c: '归自谣',n: '',h: '../ci/fengyanji/6.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Prev">上一词牌：<a id="anc_prev" href="../cipai/cipai54.html" title="上一词牌：如梦令" rev="Prev">如梦令</a></span><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai56.html" title="下一词牌：天仙子" rel="Next">天仙子</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="http://longyusheng.org" target="website">longyusheng.org</a>（<a href="http://beian.miit.gov.cn/" target="_blank">粤ICP备15040392号</a>）</div></div></div></body></html>
