<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html lang="zh-CN"><head><META http-equiv="Content-Type" content="text/html; charset=gb2312"><title>词牌《画堂春》——唐宋词格律(龙榆生)</title><meta http-equiv="Page-Enter" content="RevealTrans(Duration=0.5,Transition=7)"><meta name="keywords" content="画堂春, 词牌, 格律, 唐宋词格律, 龙榆生, 电子书"><meta name="description" content="画堂春词牌格律"><meta name="author" content="龙榆生, 左伟明"><meta name="copyright" content="左伟明 (longyusheng.org), 二零二六年一月十八日"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="../style.css" rel="stylesheet" type="text/css"><script language="javascript" type="text/javascript">var depth = "../";</script><script src="../site.js" language="javascript" type="text/javascript" defer></script></head><body><div id="PageOuterFrame"><div id="PageInnerFrame"><div class="NaviPart Breadcrumb">当前位置：<span class="SiteMapNode"><a href="../index.html">龙榆生先生词学著作选</a></span>／<span class="SiteMapNode"><a href="../cipai/index.html">唐宋词格律</a></span>／<span class="SiteMapNode"><a href="../cipai/mulu.html">目录</a></span>／</div><h1 class="PageTitle">画堂春</h1><div class="BodyContent"><div class="Page"><div><div class="ItemTitle">【画堂春】 </div><br><div class="cipaiDesc"><p>最初见《淮海居士长短句》。四十七字，前片四平韵，后片三平韵。《山谷琴趣外篇》于<a href="../ci/huangtingjian/15.html" title="参见 黄庭坚〖画堂春〗&#xD;&#xA;摩围小隐枕蛮江……">两结句各添一字</a>。</p></div><br class="empty"><a name="cp0"></a><div class="ItemTitle">【定格】</div><div class="ci"><blockquote><div><span class="zhong">中</span>平<span class="zhong">中</span>仄仄平<span class="ping">平</span><span class="yun0">（韵）</span>，<span class="zhong">中</span>平<span class="zhong">中</span>仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div><div><span class="zhong">中</span>平<span class="zhong">中</span>仄仄平<span class="ping">平</span><span class="yun0">（韵）</span>，<span class="zhong">中</span>仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div><br class="empty"><div><span class="zhong">中</span>仄<span class="zhong">中</span>平<span class="zhong">中</span>仄，<span class="zhong">中</span>平<span class="zhong">中</span>仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div><div><span class="zhong">中</span>平<span class="zhong">中</span>仄仄平<span class="ping">平</span><span class="yun0">（韵）</span>，<span class="zhong">中</span>仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div></blockquote></div><br><script type="text/javascript">var ces = {'ce1': { t: '<div><u>摩围</u>小隐枕<u>蛮<span class="ping">江</span></u>，蛛丝闲锁晴<span class="ping">窗</span>。</div><div>水风山影上修<span class="ping">廊</span>，不到晚来<span class="ping">凉</span>。</div><br class="empty"/><div>相伴蝶穿花径，独飞鸥舞溪<span class="ping">光</span>。</div><div>不因送客下绳<span class="ping">床</span>，添火注炉<span class="ping">香</span>。</div>',w: '黄庭坚',c: '画堂春',n: '添字。',h: '../ci/huangtingjian/15.html'},'ce2': { t: '<div>落红铺径水平<span class="ping">池</span>，弄晴小雨霏<span class="ping">霏</span>。</div><div>杏园憔悴杜鹃<span class="ping">啼</span>，无奈春<span class="ping">归</span>！</div><br class="empty"/><div>柳外画楼独上，凭阑<i>手</i>拈花<span class="ping">枝</span>。</div><div>放花无语对斜<span class="ping">晖</span>，此恨谁<span class="ping">知</span>？</div>',w: '秦观',c: '画堂春',n: '',h: '../ci/qinguan/8.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Prev">上一词牌：<a id="anc_prev" href="../cipai/cipai17.html" title="上一词牌：诉衷情" rev="Prev">诉衷情</a></span><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai19.html" title="下一词牌：阮郎归" rel="Next">阮郎归</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="http://longyusheng.org" target="website">longyusheng.org</a>（<a href="http://beian.miit.gov.cn/" target="_blank">粤ICP备15040392号</a>）</div></div></div></body></html>
