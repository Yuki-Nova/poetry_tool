<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html lang="zh-CN"><head><META http-equiv="Content-Type" content="text/html; charset=gb2312"><title>词牌《昭君怨》――唐宋词格律(龙榆生)</title><meta http-equiv="Page-Enter" content="RevealTrans(Duration=0.5,Transition=7)"><meta name="keywords" content="昭君怨, 宴西园, 一痕沙, 词牌, 格律, 唐宋词格律, 龙榆生, 电子书"><meta name="description" content="昭君怨词牌格律"><meta name="author" content="龙榆生, 左伟明"><meta name="copyright" content="左伟明 (longyusheng.org), 二零二六年一月十八日"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="../style.css" rel="stylesheet" type="text/css"><script language="javascript" type="text/javascript">var depth = "../";</script><script src="../site.js" language="javascript" type="text/javascript" defer></script></head><body><div id="PageOuterFrame"><div id="PageInnerFrame"><div class="NaviPart Breadcrumb">当前位置：<span class="SiteMapNode"><a href="../index.html">龙榆生先生词学著作选</a></span>／<span class="SiteMapNode"><a href="../cipai/index.html">唐宋词格律</a></span>／<span class="SiteMapNode"><a href="../cipai/mulu.html">目录</a></span>／</div><h1 class="PageTitle">昭君怨</h1><div class="BodyContent"><div class="Page"><div><div class="ItemTitle">【昭君怨、宴西园、一痕沙】 </div><br><div class="cipaiDesc"><p>又名《宴西园》、《一痕沙》。四十字，全阕四换韵，两仄两平递转，上下片同。</p></div><br class="empty"><a name="cp0"></a><div class="ItemTitle">【定格】</div><div class="ci"><blockquote><div><span class="zhong">中</span>仄<span class="zhong">中</span>平<span class="zhong">中</span><span class="ze">仄</span><span class="yun0">（韵）</span>，<span class="zhong">中</span>仄<span class="zhong">中</span>平<span class="zhong">中</span><span class="ze">仄</span><span class="yun0">（韵）</span>。</div><div><span class="zhong">中</span>仄仄平<span class="ping">平</span><span class="yun0">（韵）</span>，仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div><br class="empty"><div><span class="zhong">中</span>仄<span class="zhong">中</span>平<span class="zhong">中</span><span class="ze2">仄</span><span class="yun0">（韵）</span>，<span class="zhong">中</span>仄<span class="zhong">中</span>平<span class="zhong">中</span><span class="ze2">仄</span><span class="yun0">（韵）</span>。</div><div><span class="zhong">中</span>仄仄平<span class="ping2">平</span><span class="yun0">（韵）</span>，仄平<span class="ping2">平</span><span class="yun0">（韵）</span>。</div></blockquote></div><br><script type="text/javascript">var ces = {'ce1': { t: '<div>春到南楼雪<span class="ze">尽</span>，惊动灯期花<span class="ze">信</span>。</div><div>小雨一番<span class="ping">寒</span>，倚阑<span class="ping">干</span>。</div><br class="empty"/><div>莫把阑干频<span class="ze">倚</span>，一望几重烟<span class="ze">水</span>。</div><div>何处是京<span class="ping">华</span>？</div><div>暮云<span class="ping">遮</span>。</div>',w: '万俟咏',c: '昭君怨',n: '',h: '../ci/moqiyong/1.html'},'ce2': { t: '<div>午梦扁舟花<span class="ze">底</span>，香满<u>西湖</u>烟<span class="ze">水</span>。</div><div>急雨打篷<span class="ping">声</span>，梦初<span class="ping">惊</span>。</div><br class="empty"/><div>却是池荷跳<span class="ze">雨</span>，散了真珠还<span class="ze">聚</span>。</div><div>聚作水银<span class="ping">窝</span>，泻清<span class="ping">波</span>。</div>',w: '杨万里',c: '昭君怨',n: '',h: '../ci/yangwanli/1.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Prev">上一词牌：<a id="anc_prev" href="../cipai/cipai131.html" title="上一词牌：调笑令" rev="Prev">调笑令</a></span><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai133.html" title="下一词牌：菩萨蛮" rel="Next">菩萨蛮</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="http://longyusheng.org" target="website">longyusheng.org</a>（<a href="http://beian.miit.gov.cn/" target="_blank">粤ICP备15040392号</a>）</div></div></div></body></html>
