</div></blockquote></div><br><script type="text/javascript">var ces = {'ce1': { t: '<div>见晚晴如旧，交疏分已<span class="ping">深</span>。</div><div>舞时歌处动人<span class="ping">心</span>。</div><div>烟水数年魂梦，何处可追<span class="ping">寻</span>？</div><br class="empty"/><div>昨夜灯前见，重题汉上<span class="ping">襟</span>。</div><div>便愁云雨又难<span class="ping">禁</span>。</div><div>晓也星稀，晓也月西<span class="ping">沉</span>。</div><div>晓也雁行低度，不会寄芳<span class="ping">音</span>。</div>',w: '黄庭坚',c: '喝火令',n: '',h: '../ci/huangtingjian/16.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Prev">上一词牌：<a id="anc_prev" href="../cipai/cipai32.html" title="上一词牌：破阵子" rev="Prev">破阵子</a></span><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai34.html" title="下一词牌：行香子" rel="Next">行香子</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="http://longyusheng.org" target="website">longyusheng.org</a>（<a href="http://beian.miit.gov.cn/" target="_blank">粤ICP备15040392号</a>）</div></div></div></body></html>
