<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html lang="zh-CN"><head><META http-equiv="Content-Type" content="text/html; charset=gb2312"><title>词牌《夜游宫》——唐宋词格律(龙榆生)</title><meta http-equiv="Page-Enter" content="RevealTrans(Duration=0.5,Transition=7)"><meta name="keywords" content="夜游宫, 词牌, 格律, 唐宋词格律, 龙榆生, 电子书"><meta name="description" content="夜游宫词牌格律"><meta name="author" content="龙榆生, 左伟明"><meta name="copyright" content="左伟明 (longyusheng.org), 二零二六年一月十八日"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="../style.css" rel="stylesheet" type="text/css"><script language="javascript" type="text/javascript">var depth = "../";</script><script src="../site.js" language="javascript" type="text/javascript" defer></script></head><body><div id="PageOuterFrame"><div id="PageInnerFrame"><div class="NaviPart Breadcrumb">当前位置：<span class="SiteMapNode"><a href="../index.html">龙榆生先生词学著作选</a></span>／<span class="SiteMapNode"><a href="../cipai/index.html">唐宋词格律</a></span>／<span class="SiteMapNode"><a href="../cipai/mulu.html">目录</a></span>／</div><h1 class="PageTitle">夜游宫</h1><div class="BodyContent"><div class="Page"><div><div class="ItemTitle">【夜游宫】 </div><br><div class="cipaiDesc"><p>《<a title="参见 周邦彦 词集" href="../ci/zhoubangyan/index.html">清真集</a>》入“般涉调”。五十七字，前后片各四仄韵。</p></div><br class="empty"><a name="cp0"></a><div class="ItemTitle">【定格】</div><div class="ci"><blockquote><div>仄仄平平仄<span class="ze">仄</span><span class="yun0">（韵）</span>，仄<span class="zhong">中</span>仄、<span class="zhong">中</span>平平<span class="ze">仄</span><span class="yun0">（韵）</span>。</div><div><span class="zhong">中</span>仄平平仄<span class="zhong">中</span><span class="ze">仄</span><span class="yun0">（韵）</span>。</div><div>仄平平，仄平平，平仄<span class="ze">仄</span><span class="yun0">（韵）</span>。</div><br class="empty"><div>仄仄平平<span class="ze">仄</span><span class="yun0">（韵）</span>，仄<span class="zhong">中</span>仄、<span class="zhong">中</span>平平<span class="ze">仄</span><span class="yun0">（韵）</span>。</div><div><span class="zhong">中</span>仄平平仄<span class="zhong">中</span><span class="ze">仄</span><span class="yun0">（韵）</span>。</div><div>仄平平，仄平平，平仄<span class="ze">仄</span><span class="yun0">（韵）</span>。</div></blockquote></div><br><script type="text/javascript">var ces = {'ce1': { t: '<div><span class="mark">叶下斜阳照<span class="ze">水</span>，卷轻浪、沉沉千<span class="ze">里</span>。</span></div><div><span class="mark">桥上酸风射眸<span class="ze">子</span>。</span></div><div><span class="mark">立多时，看黄昏，灯火<span class="ze">市</span>。</span></div><br class="empty"/><div>古屋寒窗<span class="ze">底</span>，听几片、井桐飞<span class="ze">坠</span>。</div><div><span class="mark">不恋单衾再三<span class="ze">起</span>。</span></div><div><span class="mark">有谁知？为萧娘，书一<span class="ze">纸</span>。</span></div>',w: '周邦彦',c: '夜游宫',n: '',h: '../ci/zhoubangyan/36.html'},'ce2': { t: '<div><span class="mark">雪晓清笳乱<span class="ze">起</span>，梦游处、不知何<span class="ze">地</span>？</span></div><div><span class="mark">铁骑无声望似<span class="ze">水</span>。</span></div><div><span class="mark">想关河，<u>雁门</u>西，<u>青海</u><span class="ze">际</span>。</span></div><br class="empty"/><div>睡觉寒灯<span class="ze">里</span>，漏声断、月斜窗<span class="ze">纸</span>。</div><div>自许封侯在万<span class="ze">里</span>。</div><div>有谁知？鬓虽残，心未<span class="ze">死</span>。</div>',w: '陆游',c: '夜游宫',n: '',h: '../ci/luyou/6.html'},'ce3': { t: '<div>窗外捎溪雨<span class="ze">响</span>，映窗里、嚼花灯<span class="ze">冷</span>。</div><div>浑似<u>潇湘</u>系孤<span class="ze">艇</span>。</div><div>见幽仙，步凌波，月边<span class="ze">影</span>。</div><br class="empty"/><div>香苦欺寒<span class="ze">劲</span>，牵梦绕、沧涛千<span class="ze">顷</span>。</div><div><span class="mark">梦觉新愁旧风<span class="ze">景</span>。</span></div><div><span class="mark">绀云欹，玉搔斜，酒初<span class="ze">醒</span>。</span></div>',w: '吴文英',c: '夜游宫',n: '',h: '../ci/wuwenying/17.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Prev">上一词牌：<a id="anc_prev" href="../cipai/cipai71.html" title="上一词牌：鹊桥仙" rev="Prev">鹊桥仙</a></span><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai73.html" title="下一词牌：踏莎行" rel="Next">踏莎行</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="http://longyusheng.org" target="website">longyusheng.org</a>（<a href="http://beian.miit.gov.cn/" target="_blank">粤ICP备15040392号</a>）</div></div></div></body></html>
