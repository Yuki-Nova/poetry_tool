g">中</span>平<span class="zhong">中</span>仄仄平<span class="ping">平</span><span class="yun0">（韵）</span>，<span class="zhong">中</span>仄仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div></blockquote></div><br><script type="text/javascript">var ces = {'ce1': { t: '<div>古庙依青嶂，行宫枕碧<span class="ping">流</span>。</div><div>水声山色锁妆<span class="ping">楼</span>，往事思悠<span class="ping">悠</span>！</div><br class="empty"/><div>云雨朝还暮，烟花春复<span class="ping">秋</span>。</div><div>啼猿何必近孤<span class="ping">舟</span>，行客自多<span class="ping">愁</span>。</div>',w: '李珣',c: '巫山一段云',n: '',h: '../ci/lixun/3.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Prev">上一词牌：<a id="anc_prev" href="../cipai/cipai14.html" title="上一词牌：浣溪沙" rev="Prev">浣溪沙</a></span><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai16.html" title="下一词牌：采桑子" rel="Next">采桑子</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="http://longyusheng.org" target="website">longyusheng.org</a>（<a href="http://beian.miit.gov.cn/" target="_blank">粤ICP备15040392号</a>）</div></div></div></body></html>
