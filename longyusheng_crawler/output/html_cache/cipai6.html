<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html lang="zh-CN"><head><META http-equiv="Content-Type" content="text/html; charset=gb2312"><title>词牌《捣练子》——唐宋词格律(龙榆生)</title><meta http-equiv="Page-Enter" content="RevealTrans(Duration=0.5,Transition=7)"><meta name="keywords" content="捣练子, 捣练子令, 深院月, 词牌, 格律, 唐宋词格律, 龙榆生, 电子书"><meta name="description" content="捣练子词牌格律"><meta name="author" content="龙榆生, 左伟明"><meta name="copyright" content="左伟明 (longyusheng.org), 二零二六年一月十八日"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="../style.css" rel="stylesheet" type="text/css"><script language="javascript" type="text/javascript">var depth = "../";</script><script src="../site.js" language="javascript" type="text/javascript" defer></script></head><body><div id="PageOuterFrame"><div id="PageInnerFrame"><div class="NaviPart Breadcrumb">当前位置：<span class="SiteMapNode"><a href="../index.html">龙榆生先生词学著作选</a></span>／<span class="SiteMapNode"><a href="../cipai/index.html">唐宋词格律</a></span>／<span class="SiteMapNode"><a href="../cipai/mulu.html">目录</a></span>／</div><h1 class="PageTitle">捣练子</h1><div class="BodyContent"><div class="Page"><div><div class="ItemTitle">【捣练子、捣练子令、深院月】 </div><br><div class="cipaiDesc"><p>又名《深院月》。例作征妇怀念征人之词。《太和正音谱》入“双调”。二十七字，三平韵。</p></div><br class="empty"><a name="cp0"></a><div class="ItemTitle">【定格】</div><div class="ci"><blockquote><div>平仄仄，仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div><div>仄仄平平仄仄<span class="ping">平</span><span class="yun0">（韵）</span>。</div><div><span class="zhong">中</span>仄仄平平仄仄，仄平平仄仄平<span class="ping">平</span><span class="yun0">（韵）</span>。</div></blockquote></div><br><script type="text/javascript">var ces = {'ce1': { t: '<div>深院静，小庭<span class="ping">空</span>，断续寒砧断续<span class="ping">风</span>。</div><div>无奈夜长人不寐，数声和月到帘<span class="ping">栊</span>！</div>',w: '李煜',c: '捣练子令',n: '',h: '../ci/liyu/8.html'},'ce2': { t: '<div>砧面莹，杵声<span class="ping">齐</span>，捣就征衣泪墨<span class="ping">题</span>。</div><div>寄到<u>玉关</u>应万里，戍人犹在<u>玉关</u><span class="ping">西</span>！</div>',w: '贺铸',c: '杵声齐',n: '',h: '../ci/hezhu/3.html'},'ce3': { t: '<div>边堠远，置邮<span class="ping">稀</span>，附与征<i>人</i>衬铁<span class="ping">衣</span>。</div><div>连夜不妨频梦见，过年惟望得书<span class="ping">归</span>。</div>',w: '贺铸',c: '望书归',n: '',h: '../ci/hezhu/4.html'}};</script><div id="ceExtra"></div><div style="display: none;" id="cejunk"></div><div class="SiblingLinks"><span class="Prev">上一词牌：<a id="anc_prev" href="../cipai/cipai5.html" title="上一词牌：潇湘神" rev="Prev">潇湘神</a></span><span class="Next">下一词牌：<a id="anc_next" href="../cipai/cipai7.html" title="下一词牌：浪淘沙" rel="Next">浪淘沙</a></span></div></div></div><script src="../cipai.js" type="text/javascript" defer></script></div><div class="cr"><div>《唐宋词格律》：<u>上海古籍出版社</u>一九七八年版。</div><a href="../about/gy-zhizuozhe.html"><u>听琴斋主人</u></a>制作（更新于二零二六年一月十八日）<br>龙榆生先生纪念网站：<a href="http://longyusheng.org" target="website">longyusheng.org</a>（<a href="http://beian.miit.gov.cn/" target="_blank">粤ICP备15040392号</a>）</div></div></div></body></html>
