# ============================================================
# Poetry Tool — Nginx 配置
# ============================================================

# ── 主工具 poetry.yukinova.top ──
server {
    listen 80;
    server_name poetry.yukinova.top;

    # API 代理
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 主工具 SPA
    location / {
        root /www/wwwroot/poetry/tool/dist;
        try_files $uri $uri/ /index.html;
    }
}

# ── 管理后台 admin.poetry.yukinova.top ──
server {
    listen 80;
    server_name admin.poetry.yukinova.top;

    # API 代理
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理后台 SPA
    location / {
        root /www/wwwroot/poetry/admin/dist;
        try_files $uri $uri/ /index.html;
    }
}
